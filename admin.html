<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Push Tips</title>
<style>
body{background:#111;color:#fff;font-family:Arial;padding:15px}
h2{text-align:center;color:#22c55e}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;box-sizing:border-box}
input{background:#222;color:#fff;border:1px solid #333}
button{background:#22c55e;font-weight:bold;cursor:pointer;color:#000;font-size:16px}
.del{background:#ef4444;color:#fff;margin-top:25px}
#msg{text-align:center;margin:10px;font-weight:bold;color:yellow}
label{font-size:12px;color:#888}
</style>
</head>
<body>
<h2>9ja Odds Admin - DIRECT</h2>
<div id="form"></div>
<input id="code" placeholder="Booking Code (e.g T2VAK0)" value="T2VAK0">
<button onclick="push()">PUSH ALL GAMES</button>
<button class="del" onclick="clearAll()">🗑️ CLEAR ALL GAMES</button>
<p id="msg"></p>

<script>
const URL = "https://jokbvhugvehbjxndfqmo.supabase.co/rest/v1/predictions";
const KEY = "sb_publishable_LVbrVhVaw08i75onV0Y1tQ_IW-iV0WN";

let html='';
for(let i=1;i<=8;i++){
 html+=`<div style="border:1px solid #333;padding:10px;border-radius:8px;margin:10px 0"><label>GAME ${i}</label><input id="t${i}" placeholder="Teams: Chelsea vs Arsenal"><input id="l${i}" placeholder="League: Premier League"><input id="ti${i}" placeholder="Time: 15:00"><input id="tip${i}" placeholder="Tip: Over 1.5"></div>`;
}
document.getElementById('form').innerHTML=html;

async function clearAll(){
 if(!confirm('Clear all games?'))return;
 document.getElementById('msg').innerText='Clearing...';
 let r = await fetch(URL+'?id=gte.0', {
   method:'DELETE',
   headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}
 });
 document.getElementById('msg').innerText = r.ok ? 'All games cleared!' : 'Clear Error: '+r.status;
}

async function push(){
 let rows=[]; let code=document.getElementById('code').value;
 for(let i=1;i<=8;i++){
   let teams=document.getElementById('t'+i).value.trim();
   if(!teams)continue;
   rows.push({teams:teams,league:document.getElementById('l'+i).value,time:document.getElementById('ti'+i).value,tip:document.getElementById('tip'+i).value,code:code});
 }
 if(rows.length==0){document.getElementById('msg').innerText='Type at least 1 game';return;}
 document.getElementById('msg').innerText='Pushing...';
 
 // First clear old
 await fetch(URL+'?id=gte.0', {method:'DELETE', headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});
 
 let r = await fetch(URL, {
   method:'POST',
   headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
   body: JSON.stringify(rows)
 });
 document.getElementById('msg').innerText = r.ok ? 'SUCCESS! '+rows.length+' games pushed to website!' : 'Error: '+r.status+' '+(await r.text());
}
</script>
</body>
</html>
