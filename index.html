<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predict Today</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#080808;color:#fff;padding:15px}
.header{text-align:center;padding:20px 0}
.header h1{color:#00ff66;font-size:28px}
.card{background:#181818;border:1px solid #2a2a2a;border-radius:14px;padding:16px}
.row{padding:16px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between}
.tip{color:#00ff66;font-weight:bold;background:#0f2a18;padding:6px 12px;border-radius:20px}
.code-box{background:#000;border:2px dashed #00ff66;color:#00ff66;padding:18px;border-radius:12px;text-align:center;font-size:32px;letter-spacing:5px;font-weight:bold;margin:20px 0}
.btn{width:100%;background:#00ff66;color:#000;border:none;padding:16px;border-radius:10px;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<div class="header"><h1>🔮 Predict Today</h1><p>Daily Winning Tips</p></div>
<div id="games" class="card"><p style="text-align:center;color:#777">Loading...</p></div>
<script>
const SUPABASE_URL = "https://ddpxcokszqtizoacvpid.supabase.co";
const SUPABASE_KEY = "sb_publishable_gDMnqreuxEPCxeDPDqgSoQ_NgR6pDLk";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function load(){
const {data} = await client.from('predictions').select('*').order('id',{ascending:false}).limit(10);
if(!data||data.length==0){document.getElementById('games').innerHTML='No tips yet';return;}
let code = data[0].code;
let html='';
data.reverse().forEach(p=>{
html+=`<div class="row"><span>${p.teams}</span><span class="tip">${p.tip}</span></div>`;
});
html+=`<div style="margin-top:10px"><p style="text-align:center;color:#777;font-size:12px;margin-top:15px">CODE FOR ALL GAMES</p><div class="code-box">${code}</div><button class="btn" onclick="navigator.clipboard.writeText('${code}');window.open('https://www.sportybet.com/ng','_blank')">Bet Now on SportyBet →</button></div>`;
document.getElementById('games').innerHTML=html;
}
load();
</script>
</body>
</html>
