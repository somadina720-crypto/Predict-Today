<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Predict Today</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;padding:10px}.card{background:#1e1e1e;border-radius:12px;padding:12px;margin:10px 0;display:flex;justify-content:space-between}.badge{background:#fff;color:#000;padding:6px 12px;border-radius:20px;font-weight:bold;font-size:12px}.code-box{border:1px dashed #fff;padding:15px;text-align:center;border-radius:10px;margin:15px 0;letter-spacing:3px;font-size:20px}.no-tips{text-align:center;padding:60px 20px;color:#666}</style>
</head><body>
<h1 style="color:#22c55e;text-align:center">Predict Today</h1>
<div id="games">Loading...</div>
<div id="codeArea" style="display:none"><div class="code-box" id="bookingCode"></div></div>
<div id="noTips" class="no-tips" style="display:none"><h2>No tips yet</h2><p>New predictions coming soon!</p></div>
<script>
const supabaseClient = supabase.createClient("https://jokbvhugvehbjxndfqmo.supabase.co","sb_publishable_LVbrVhVaw08i75onV0Y1tQ_IW-iV0WN");
async function loadGames(){
  const oneDayAgo = new Date(Date.now() - 24*60*60*1000).toISOString();
  const {data} = await supabaseClient.from('predictions').select('*').gte('created_at', oneDayAgo).order('created_at',{ascending:true});
  if(!data || data.length===0){document.getElementById('games').innerHTML="";document.getElementById('noTips').style.display="block";document.getElementById('codeArea').style.display="none";return;}
  document.getElementById('noTips').style.display="none";document.getElementById('codeArea').style.display="block";
  document.getElementById('bookingCode').innerText=data[0].code;
  let html=""; data.forEach(g=>{html+=`<div class="card"><div><b>${g.teams}</b><br><small>${g.time} • ${g.league}</small></div><div class="badge">${g.tip}</div></div>`});
  document.getElementById('games').innerHTML=html;
  supabaseClient.from('predictions').delete().lt('created_at', oneDayAgo).then(()=>{});
}
loadGames();
</script></body></html>
