<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predict Today</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#080808;color:#fff;padding:10px;-webkit-user-select:none;user-select:none}
.header{text-align:center;padding:10px 0 4px 0}
.header h1{
  font-size:22px;font-weight:900;
  background: linear-gradient(90deg, #ffffff 0%, #00ff66 50%, #ff3b3b 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.header p{
  font-size:12px;
  background: linear-gradient(90deg, #fff, #00ff88, #ff7777);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* VERY SMALL MOVING TEXT */
.marquee{width:100%;overflow:hidden;white-space:nowrap;background:#111;border-radius:6px;padding:3px 0;margin:8px 0}
.marquee-content{display:inline-block;animation:marquee 12s linear infinite;color:#ffcc00;font-size:8px!important;font-weight:bold;letter-spacing:0.3px}
@keyframes marquee{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}

.card{background:#181818;border:1px solid #2a2a2a;border-radius:14px;padding:10px}
.row{padding:11px 0;border-bottom:1px solid #222;display:flex;justify-content:space-between;align-items:center}
.team-box{flex:1}
.team-name{font-size:13px;font-weight:bold}
.team-meta{font-size:10px;color:#888;margin-top:3px}
.tip{background:#fff!important;color:#000!important;font-weight:800;padding:5px 10px;border-radius:20px;font-size:11px}

/* CODE WHITE & NO COPY */
.code-box{background:#000;border:1.5px dashed #fff;color:#fff!important;padding:12px;border-radius:10px;text-align:center;font-size:20px;letter-spacing:3px;font-weight:bold;margin:14px 0;user-select:none!important;pointer-events:none!important}

/* BET NOW RED */
.btn{
  width:100%;
  background:#ff1a1a!important;
  color:#fff!important;
  border:none;padding:14px;border-radius:10px;
  font-weight:900;font-size:15px;cursor:pointer;
  box-shadow:0 0 10px rgba(255,0,0,0.4);
}

/* JOIN COMMUNITY - COMBINED */
.community-box{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin-top:16px;text-align:center}
.community-title{font-size:13px;font-weight:800;margin-bottom:10px;color:#fff}
.join-btns{display:flex;gap:8px}
.btn-wa{flex:1;background:#25D366;color:#fff;padding:10px;border-radius:8px;font-weight:bold;font-size:12px;text-decoration:none;text-align:center}
.btn-tg{flex:1;background:#5dade2;color:#fff;padding:10px;border-radius:8px;font-weight:bold;font-size:12px;text-decoration:none;text-align:center}
</style>
</head>
<body oncontextmenu="return false;">

<div class="header">
  <h1>Predict Today</h1>
  <p>Daily Tips</p>
</div>

<div class="marquee"><div class="marquee-content">18+ Bet Responsibly • 18+ Bet Responsibly • 18+ Bet Responsibly • 18+ Bet Responsibly •</div></div>

<div id="games" class="card"><p style="text-align:center;color:#777;font-size:12px">Loading...</p></div>

<script>
const SUPABASE_URL = "https://ddpxcokszqtizoacvpid.supabase.co";
const SUPABASE_KEY = "sb_publishable_gDMnqreuxEPCxeDPDqgSoQ_NgR6pDLk";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function load(){
const {data} = await client.from('predictions').select('*').order('id',{ascending:false}).limit(10);
if(!data||data.length==0){document.getElementById('games').innerHTML='No tips yet';return;}
let code = data[0].code;
let html='';
data.reverse().forEach(p=>{
  let time = p.time || "19:30";
  let league = p.league || "EPL";
  html+=`<div class="row"><div class="team-box"><div class="team-name">${p.teams}</div><div class="team-meta">• ${time} • ${league}</div></div><span class="tip">${p.tip}</span></div>`;
});
html+=`<div style="margin-top:8px"><p style="text-align:center;color:#777;font-size:10px;margin-top:10px">CODE FOR ALL GAMES</p><div class="code-box">${code}</div><button class="btn" onclick="navigator.clipboard.writeText('${code}');window.open('https://www.sportybet.com/ng?shareCode=${code}','_blank')">Bet Now on SportyBet →</button></div>`;
html+=`<div class="community-box"><div class="community-title">🔥 JOIN COMMUNITY</div><div class="join-btns"><a href="https://whatsapp.com/channel/0029VbDaWqJ2f3EGNIgRsC1r" target="_blank" class="btn-wa">WhatsApp</a><a href="https://t.me/predict_Today_bets" target="_blank" class="btn-tg">Telegram</a></div></div>`;
document.getElementById('games').innerHTML=html;
}
load();
document.addEventListener('copy', e => e.preventDefault());
</script>
</body>
</html>
