<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Predict Today</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;margin:0;padding:15px}
.header{text-align:center;padding:20px 0}
.header h1{color:#22c55e;margin:0}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;margin:10px 0}
.tip{color:#22c55e;font-weight:bold;float:right}
.code-box{background:#22c55e;color:#000;padding:15px;border-radius:10px;text-align:center;font-weight:bold;font-size:18px;margin:20px 0}
</style>
</head>
<body>
<div class="header">
<h1>Predict Today</h1>
<p id="date"></p>
<p style="font-size:12px;color:#888">18+ Bet Responsibly</p>
</div>
<div id="games">Loading...</div>
<script>
document.getElementById('date').innerText = new Date().toDateString();
const sb = supabase.createClient("https://jokbvhugvehbjxndfqmo.supabase.co","sb_publishable_LVbrVhVaw08i75onV0Y1tQ_IW-iV0WN");
async function load(){
 let {data,error} = await sb.from('predictions').select('*').order('id',{ascending:true});
 if(error){document.getElementById('games').innerHTML=error.message;return;}
 if(!data || data.length==0){
   document.getElementById('games').innerHTML='<div style="text-align:center;padding:60px">⚽ No tips yet for today</div>';
   return;
 }
 let html=''; let code='';
 data.forEach(g=>{
   html+=`<div class="card"><span class="tip">${g.tip}</span><b>${g.teams}</b><br><small>${g.league} - ${g.time}</small></div>`;
   code=g.code;
 });
 if(code) html+=`<div class="code-box">Booking Code: ${code}</div>`;
 document.getElementById('games').innerHTML=html;
}
load();
</script>
</body>
</html>
